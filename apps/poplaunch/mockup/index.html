<title>Pop Launch Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700;800&display=swap">
<style>
/* Layout: the POP PRESS screens as one page; views swap by hash. Single committed light look (the brand). */
:root {
  --bg: #fcfaf6; --surface: #faf8f4; --white: #fff; --ink: #000; --muted: #4b4638; --line: #d9d3c6;
  --red: #fb473b; --red-deep: #f33d30; --yellow: #fddf31; --peach: #fbe6c5; --green: #37c04a; --mint: #bff0c6;
  --display: "Rubik", "Arial Rounded MT Bold", "Arial Black", sans-serif;
  --condensed: "Anton", "Impact", "Arial Narrow", sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, monospace;
  --body: "Inter", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; min-height: 100%; display: flex; flex-direction: column; overflow-x: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }
.wrap { width: 100%; max-width: 1536px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 768px) { .wrap { padding-inline: 62px; } }

.display { font-family: var(--display); font-weight: 900; line-height: 0.88; letter-spacing: -0.035em; -webkit-text-stroke: 0.018em currentColor; paint-order: stroke fill; }
.condensed { font-family: var(--condensed); font-weight: 400; line-height: 0.9; }
.wordmark { font-family: var(--display); font-weight: 900; letter-spacing: -0.04em; line-height: 1; -webkit-text-stroke: 0.035em currentColor; paint-order: stroke fill; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.addr { font-family: var(--mono); font-size: 0.9em; word-break: break-all; }
.muted { color: var(--muted); }
.label { font-size: 15px; color: var(--muted); }
.link { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; background: none; border: 0; padding: 0; cursor: pointer; font-weight: inherit; }
.marker { background: linear-gradient(transparent 62%, var(--yellow) 62%, var(--yellow) 100%); padding: 0 0.1em 0.08em; }

.box { background: var(--white); border: 3.5px solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 24px; border-radius: 12px; font-weight: 700; font-size: 18px; line-height: 1; white-space: nowrap; border: 2.5px solid var(--ink); background: var(--white); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); transition: transform 120ms, box-shadow 120ms, background 120ms; cursor: pointer; text-decoration: none; }
.btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: var(--red-deep); }
.btn-lg { min-height: 62px; padding: 0 32px; font-size: 20px; }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: 16px; box-shadow: 2px 2px 0 var(--ink); }
.btn-plain { border-color: transparent; box-shadow: none; background: transparent; }
.btn-plain:hover { transform: none; box-shadow: none; background: #f1ede6; }
.btn.full { width: 100%; }
.btn svg { flex: none; }

.input { width: 100%; min-height: 48px; background: var(--white); border: 2.5px solid var(--ink); border-radius: 12px; padding: 0 14px; color: var(--ink); font: inherit; font-size: 16px; }
textarea.input { padding: 10px 14px; min-height: 96px; resize: vertical; }
.input::placeholder { color: #7d776a; }
.bar { height: 30px; background: var(--white); border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px 0 0 999px; transition: width 300ms ease-out; background: var(--yellow); }
.bar > span.hot { background: var(--red); }
.bar-lg { height: 40px; }
.progress { height: 14px; background: var(--white); border: 2.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--red); }
.chip { display: inline-flex; align-items: center; font-weight: 700; font-size: 17px; padding: 6px 16px; border-radius: 8px; border: 2px solid var(--ink); background: var(--peach); white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; padding: 4px 10px; border-radius: 8px; border: 2px solid var(--ink); background: var(--white); white-space: nowrap; }
.tag-yellow { background: var(--yellow); } .tag-green { background: var(--mint); } .tag-ink { background: var(--ink); color: #fff; font-size: 11px; }
.tab { font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 10px; min-height: 36px; border: 2px solid transparent; background: none; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--yellow); border-color: var(--ink); }
.nav-link { font-weight: 700; font-size: 18px; padding: 8px 2px; position: relative; text-decoration: none; }
.nav-link[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 4px; background: var(--red); border-radius: 2px; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
dl { margin: 0; } dt, dd { margin: 0; }
.kv { display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; }
.kv dd { text-align: right; }
.kv .total { border-top: 2px solid var(--ink); padding-top: 8px; font-weight: 700; }
h1, h2, h3, p { margin: 0; }
details > summary { list-style: none; cursor: pointer; } details > summary::-webkit-details-marker { display: none; }

/* strip + header */
.strip { background: var(--yellow); font-size: 13px; }
.strip .wrap { min-height: 32px; padding-block: 4px; display: flex; align-items: center; gap: 8px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; }
.strip i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none; }
header.top { background: var(--bg); border-bottom: 3px solid var(--ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; }
header.top .wrap { position: relative; height: 72px; display: flex; align-items: center; }
.brand { position: relative; display: inline-flex; align-items: baseline; text-decoration: none; white-space: nowrap; font-size: 28px; }
.brand .burst { position: absolute; left: 50px; top: -8px; width: 16px; height: 16px; }
nav.primary { display: none; position: absolute; left: 50%; transform: translateX(-50%); gap: 40px; align-items: center; }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 6px; position: relative; }
.menu { position: absolute; right: 0; top: 56px; width: 224px; padding: 8px; z-index: 40; }
.menu a, .menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; font-weight: 700; text-decoration: none; background: none; border: 0; cursor: pointer; }
.menu a:hover, .menu button:hover { background: var(--bg); }
.wmenu { width: 288px; font-size: 15px; }
.burger { width: 40px; padding: 0; }
@media (min-width: 768px) {
  header.top .wrap { height: 92px; } .brand { font-size: 54px; } .brand .burst { left: 96px; top: -20px; width: 30px; height: 30px; }
  nav.primary { display: flex; } .burger { display: none; } .hdr-right { gap: 8px; }
}

/* hero */
.hero { padding-block: 24px 32px; display: grid; gap: 40px 48px; align-items: start; }
.hero h1 { font-size: 66px; line-height: .85; letter-spacing: -0.045em; }
.hero h1 span { display: block; } .hero h1 .pop { color: var(--red-deep); }
.hero .tag-line { font-weight: 700; font-size: 20px; margin-top: 20px; letter-spacing: -0.01em; }
@media (min-width: 640px) { .hero h1 { font-size: 92px; } }
@media (min-width: 1024px) { .hero { grid-template-columns: minmax(0,1fr) auto; padding-block: 22px 26px; } .hero h1 { font-size: 112px; } .hero .tag-line { font-size: 25px; margin-top: 12px; } .hero .copy { padding-top: 26px; } }
@media (min-width: 1536px) { .hero h1 { font-size: 132px; } }
.rule { border-top: 3px solid var(--ink); }

/* featured panel: stacked on phones, the mockup's absolute layout at desktop (scaled to fit) */
.feat-wrap { width: 100%; }
.feat { background: var(--yellow); position: relative; border-radius: 18px; }
.feat .clouds { position: absolute; inset: 0; overflow: hidden; border-radius: 15px; pointer-events: none; }
.feat .cloud-a { position: absolute; bottom: -4px; left: 300px; display: none; }
.feat .cloud-b { position: absolute; bottom: -4px; right: -6px; width: 220px; }
.feat .inner { position: relative; padding: 24px 20px 80px; display: flex; flex-direction: column; gap: 20px; }
.note { position: relative; align-self: flex-start; transform: rotate(-8deg); background: #fff; border: 2.5px solid var(--ink); border-radius: 3px; padding: 12px 14px; font-family: var(--mono); font-weight: 700; font-size: 14px; line-height: 1.25; text-transform: uppercase; letter-spacing: .03em; width: 152px; }
.note svg { position: absolute; right: -16px; bottom: -20px; }
.feat .balloon { align-self: center; margin-top: -8px; }
.feat .balloon img { width: 230px; height: auto; display: block; }
.feat .name { font-size: 56px; line-height: .85; }
.feat .cap { font-family: var(--mono); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .2em; margin-top: 12px; line-height: 1.6; max-width: 300px; }
.feat .pct { font-size: 84px; line-height: .8; }
.feat .sol { font-family: var(--mono); font-weight: 700; font-size: 20px; margin-top: 12px; }
.feat .bar { margin-top: 12px; }
.feat .cd { margin-top: 12px; }
.feat .deco { display: none; position: absolute; }
@media (min-width: 1024px) {
  .feat-wrap { width: 887px; max-width: 100%; height: calc(405px * var(--s, 1)); }
  .feat { width: 887px; height: 405px; transform: scale(var(--s, 1)); transform-origin: top left; }
  .feat .cloud-a { display: block; width: 120px; }
  .feat .inner { padding: 0; height: 100%; display: block; }
  .feat .inner > * { position: absolute; }
  .note { left: 37px; top: 26px; font-size: 17px; }
  .feat .balloon { left: 258px; top: -21px; margin: 0; } .feat .balloon img { width: 325px; }
  .feat .ident { left: 37px; top: 236px; width: 300px; }
  .feat .name { font-size: 84px; } .feat .cap { font-size: 15px; margin-top: 14px; }
  .feat .stats { right: 27px; top: 66px; width: 288px; text-align: right; }
  .feat .pct { font-size: 124px; padding-right: 4px; } .feat .sol { font-size: 26px; margin-top: 14px; padding-right: 24px; }
  .feat .bar { margin-top: 18px; text-align: left; } .feat .cd { margin-top: 12px; text-align: left; }
  .feat .deco { display: block; }
}
.balloon-float { animation: balloon-float 5s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes balloon-float { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }

/* launches */
.launches { padding-top: 20px; }
.launches .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.launches h2 { font-size: 32px; }
.launches .see { font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; }
.rows { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
.row { background: var(--surface); position: relative; display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; column-gap: 16px; padding: 16px; }
.row .av { position: relative; width: 70px; height: 86px; }
.row .av .b { position: absolute; left: 0; top: -12px; z-index: 2; }
.row .av img { width: 70px; height: auto; display: block; filter: drop-shadow(-6px 8px 6px rgba(0,0,0,.12)); }
.row .av .str { position: absolute; left: 34px; top: 82px; }
.row h3 { font-size: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row h3 a { text-decoration: none; } .row h3 a:hover { text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 3px; text-underline-offset: 4px; }
.row .tl { font-family: var(--mono); font-size: 13px; margin-top: 6px; }
.row .prog { grid-column: 1 / -1; margin-top: 12px; }
.row .prog .sol { font-family: var(--mono); font-weight: 700; font-size: 14px; margin-top: 8px; }
.row .pct { font-weight: 800; font-size: 24px; margin-top: 8px; }
.row .left { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; margin-top: 8px; justify-content: flex-end; }
.row .act { grid-column: 1 / -1; margin-top: 16px; }
@media (min-width: 768px) {
  .launches { padding-top: 18px; } .launches .head { padding-inline: 10px; } .launches h2 { font-size: 42px; } .launches .see { font-size: 16px; padding-right: 7px; }
  .row { grid-template-columns: 120px minmax(0,1fr) minmax(180px,300px) 80px 130px auto; padding: 0; height: 106px; }
  .row .av { width: 120px; height: 100%; } .row .av .b { left: 24px; top: -6px; } .row .av img { width: 88px; } .row .av .str { left: 40px; top: 100px; }
  .row h3 { font-size: 30px; } .row .tl { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .prog, .row .act { grid-column: auto; margin-top: 0; } .row .prog .sol { margin-top: 10px; }
  .row .pct { font-size: 27px; margin-top: 0; } .row .left { margin-top: 0; justify-content: flex-start; font-size: 18px; }
  .row .act { padding-right: 20px; } .row .act .btn { width: 200px; }
}
@media (min-width: 1536px) { .row { grid-template-columns: 142px 292px 363px 95px 174px auto; column-gap: 20px; } .row .av { width: 142px; } .row .av .b { left: 40px; } .row .act { padding-right: 30px; } .row .act .btn { width: 243px; } }

/* launch detail */
.crumb { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
.devbar { padding: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; margin-top: 12px; }
.detail { margin-top: 20px; display: grid; gap: 32px; align-items: start; }
@media (min-width: 1024px) { .detail { grid-template-columns: 7fr 5fr; gap: 40px; } .detail aside { position: sticky; top: 112px; } }
.ident-row { display: flex; align-items: flex-start; gap: 16px; }
.ident-row img.small { width: 64px; height: auto; flex: none; }
.ident-row h1 { font-size: 32px; overflow-wrap: anywhere; }
.ident-row h1 .tk { color: var(--muted); font-weight: 800; font-size: 20px; white-space: nowrap; -webkit-text-stroke: 0; }
.ident-row .meta { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 15px; color: var(--muted); }
.ident-row .pill-d { display: none; }
@media (min-width: 768px) { .ident-row { align-items: center; } .ident-row h1 { font-size: 44px; } .ident-row h1 .tk { font-size: 24px; } .ident-row .pill-m { display: none; } .ident-row .pill-d { display: inline-flex; } }
.tagline { margin-top: 16px; font-size: 17px; color: var(--muted); max-width: 56ch; }
.stage { margin-top: 24px; padding: 24px; position: relative; overflow: hidden; }
.stage .blob1 { position: absolute; right: -48px; top: -48px; width: 192px; height: 192px; border-radius: 50%; background: var(--yellow); }
.stage .blob2 { position: absolute; left: -40px; bottom: 24px; width: 112px; height: 112px; border-radius: 50%; background: var(--yellow); }
.stage .center { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
.stage .big { display: flex; align-items: flex-end; justify-content: center; width: 300px; max-width: 100%; height: 340px; }
.stage .big img { width: 220px; height: auto; display: block; transform-origin: 50% 100%; }
@media (min-width: 768px) { .stage { padding: 32px; } .stage .big img { width: 300px; } }
.stage h2.hl { font-size: 30px; margin-top: 12px; max-width: 16ch; }
@media (min-width: 768px) { .stage h2.hl { font-size: 40px; } }
.stage .acts { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.stage .figures { position: relative; margin-top: 24px; }
.stage .figures .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stage .figures .sol { font-family: var(--mono); font-weight: 700; font-size: 22px; }
.stage .figures .pct { font-size: 56px; line-height: .8; }
.stage .figures .foot { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px 24px; }
.popped { position: relative; display: flex; align-items: center; justify-content: center; width: 300px; max-width: 100%; height: 240px; }
.popped img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; position: relative; }
.confetti { position: absolute; left: 50%; top: 50%; border-radius: 2px; border: 1px solid var(--ink); animation: confetti 1.2s ease-out 1 forwards; }
@keyframes confetti { 0% { transform: translate(0,0) scale(.4) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot)); opacity: .9; } }
.panel { padding: 20px; } @media (min-width: 768px) { .panel { padding: 24px; } }
.panel h2 { font-size: 22px; }
.panel .head { display: flex; align-items: center; justify-content: space-between; }
.presets { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
.presets .fill { margin-left: auto; }
.err { margin-top: 8px; font-size: 14px; min-height: 20px; color: var(--red-deep); }
.lock { margin-top: 16px; font-size: 15px; border-radius: 16px; background: var(--bg); padding: 16px; border: 1px solid var(--line); }
.steps { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: flex; align-items: center; gap: 12px; font-size: 15px; }
.steps .dot { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; background: var(--bg); border: 1px solid var(--line); }
.steps .done { background: var(--mint); color: #1f7a4d; border: 0; } .steps .pending { background: var(--yellow); border: 0; }
.steps .st { margin-left: auto; font-size: 15px; color: var(--muted); }
.drow { display: grid; grid-template-columns: minmax(0,11rem) 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.drow dt { color: var(--muted); } .drow dd { min-width: 0; overflow-wrap: anywhere; }
.sticky-act { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(250,248,244,.95); backdrop-filter: blur(4px); border-top: 1px solid var(--line); }
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); }
.sheet { position: absolute; bottom: 0; left: 0; right: 0; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; background: var(--bg); padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 1024px) { .sticky-act, .sheet-bg { display: none !important; } .aside-funding { display: block; } }
.aside-funding { display: none; } @media (min-width: 1024px) { .aside-funding { display: block; } }
.pb-mobile { padding-bottom: 112px; } @media (min-width: 1024px) { .pb-mobile { padding-bottom: 48px; } }

/* create */
.form { display: flex; flex-direction: column; gap: 20px; max-width: 760px; }
.field > span.t { display: block; font-weight: 700; font-size: 15px; }
.field > .input { margin-top: 4px; }
.field .hint { margin-top: 4px; }
.two { display: grid; gap: 20px; } @media (min-width: 640px) { .two { grid-template-columns: 1fr 1fr; } }
.file-row { display: flex; align-items: center; gap: 16px; margin-top: 4px; }
.file-row .pv { width: 72px; height: 72px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff; object-fit: cover; flex: none; }
.pv-head { display: flex; align-items: center; gap: 16px; }
.pv-head img, .pv-head .ph { width: 64px; height: 64px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--peach); object-fit: cover; flex: none; }

/* how it works */
.hiw h1 { font-size: 40px; } @media (min-width: 768px) { .hiw h1 { font-size: 56px; } }
.hiw .lead { font-weight: 700; font-size: 18px; margin-top: 12px; max-width: 52ch; }
.hiw .steps3 { margin-top: 32px; padding: 24px; display: grid; gap: 24px; } @media (min-width: 768px) { .hiw .steps3 { grid-template-columns: repeat(3,1fr); padding: 32px; gap: 32px; } }
.hiw .step { display: flex; gap: 16px; }
.hiw .n { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
.hiw .step h2 { font-size: 22px; } .hiw .step p { font-size: 15px; color: var(--muted); margin-top: 4px; }
.faq { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 760px; }
.faq details { padding: 20px; } .faq summary { font-weight: 700; font-size: 17px; } .faq p { font-size: 15px; color: var(--muted); margin-top: 8px; }

/* my pops */
.plist { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }

<script>
(function () {
  "use strict";
  // ---------- demo data (the three mockup coins; every number is invented) ----------
  const SOL = 1e9, H = 3600e3, T0 = Date.now();
  const TARGET = 50 * SOL;
  const V1 = { supply: 1e9, backerAlloc: 5e8, poolAlloc: 5e8, decimals: 6, fee: 0.1, minContribution: 0.01, windowH: 24, timeoutMin: 60, dex: "Raydium CPMM", version: 1 };
  const addr = (seed) => { const A = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"; let h = 7, o = ""; for (let i = 0; i < 44; i++) { h = (h * 31 + seed.charCodeAt(i % seed.length) + i) % 100003; o += A[h % A.length]; } return o; };
  const COINS = [
    { id: "cat-exe", name: "CAT.EXE", ticker: "CATEXE", balloon: "art/balloon-cat.png", featured: "art/balloon-cat-featured.png", face: "art/face-cat.png", tagline: "Terminal cat. Higher together.", description: "A coin by the people. For the people.", x: "catexe", raised: 42 * SOL, backers: 212, hoursLeft: 2, creatorSol: 1 },
    { id: "froggo", name: "FROGGO", ticker: "FROGGO", balloon: "art/balloon-frog.png", featured: "art/balloon-frog.png", face: "art/face-frog.png", tagline: "Just a frog. Big plans.", description: "Just a frog. Big plans.", x: "", raised: 28 * SOL, backers: 131, hoursLeft: 5, creatorSol: 0 },
    { id: "goodboy", name: "GOODBOY", ticker: "GOODBOY", balloon: "art/balloon-dog.png", featured: "art/balloon-dog.png", face: "art/face-dog.png", tagline: "Good dogs go higher.", description: "Good dogs go higher.", x: "", raised: 19 * SOL, backers: 88, hoursLeft: 8, creatorSol: 0 },
  ].map((c) => { const fd = T0 + c.hoursLeft * H + 59e3; return Object.assign(c, { state: "funding", creator: addr("creator:" + c.id), mint: addr("mint:" + c.id), openedAt: fd - V1.windowH * H, fundingDeadline: fd, filledAt: null, settlementDeadline: null, liveAt: null, refundReason: null }); });
  const STATE_LABEL = { funding: "Filling up", ready: "Getting ready", live: "Live", refundable: "Refund available" };
  function withState(c, s) {
    const now = Date.now(), l = Object.assign({}, c, { state: s });
    if (s === "funding") return c;
    if (s === "ready") return Object.assign(l, { raised: TARGET, openedAt: now - 19 * H, fundingDeadline: now + 5 * H, filledAt: now - 12 * 60e3, settlementDeadline: now + 48 * 60e3 });
    if (s === "live") return Object.assign(l, { raised: TARGET, openedAt: now - 30 * H, fundingDeadline: now - 6 * H, filledAt: now - 7 * H, settlementDeadline: now - 6 * H, liveAt: now - 2 * H });

  }
  // ---------- formatting ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const fmtSol = (lamports, places = 4) => { const v = Math.abs(lamports); const whole = Math.floor(v / SOL); let frac = String(Math.round(v - whole * SOL)).padStart(9, "0").slice(0, places).replace(/0+$/, ""); return whole.toLocaleString("en-US") + (frac ? "." + frac : ""); };
  const fmtTok = (n) => Math.floor(n).toLocaleString("en-US");
  const pctOf = (raised) => { const bps = Math.floor(raised * 10000 / TARGET); const w = Math.floor(bps / 100), t = Math.floor((bps % 100) / 10); return { bps, text: (t === 0 || w >= 100) ? w + "%" : w + "." + t + "%" }; };
  const scaleOf = (bps) => 0.62 + 0.38 * Math.sqrt(Math.max(0, Math.min(1, bps / 10000)));
  const fmtDur = (ms) => { if (ms <= 0) return "0m"; const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24); return d >= 1 ? d + "d " + (h % 24) + "h" : h >= 1 ? h + "h" : m + "m"; };
  const left = (t) => fmtDur(t - Date.now()) + " left";
  const ago = (t) => fmtDur(Date.now() - t) + " ago";
  const short = (a, n = 4) => a.slice(0, n) + "…" + a.slice(-n);
  const utc = (t) => t === null ? "—" : new Date(t).toUTCString().replace(" GMT", " UTC");
  const entitlement = (sol) => Math.floor(sol * SOL * V1.backerAlloc / TARGET);
  const LOCK = "Your SOL is locked until this launch succeeds or becomes refundable. If it launches, you receive tokens. Your SOL goes into the trading pool. Network fees are separate.";
  const arrow = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
  const clock = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5.5l3.5 2"/></svg>';

            '<div class="condensed pct num">' + p.text + '</div><div class="sol num">' + fmtSol(f.raised, 2) + ' / 50 SOL</div>' +
            '<div class="bar bar-lg" role="progressbar" aria-valuenow="' + Math.round(p.bps / 100) + '" aria-valuemin="0" aria-valuemax="100" aria-label="' + esc(f.name) + ' funded ' + p.text + '"><span class="hot" style="width:' + Math.min(100, p.bps / 100) + '%"></span></div>' +

        '</div></section></div>' +
      '</section><div class="rule"></div>' +
      '<section id="launches" class="wrap launches"><div class="head"><h2 class="display"><span class="marker">Demo</span> launches</h2><a class="see" href="#launches">See all launches ' + arrow.replace('width="20" height="20"', 'width="18" height="18"') + '</a></div>' +
      '<ul class="rows" role="list">' + rows.map(rowView).join("") + '</ul></section>';
  }

  }

  function launchView(id, state) {
    const base = COINS.find((c) => c.id === id);
    if (!base) return '<div class="wrap page"><h1 class="display" style="font-size:40px">Not found</h1><p class="label" style="margin-top:12px">No demo launch with that id. <a class="link" href="#home">Back to launches</a></p></div>';

    const dev = '<div class="box devbar" role="group" aria-label="Dev-only state preview"><span class="tag tag-ink">Dev preview</span><span class="label">Show this launch as:</span>' + ["funding", "ready", "live", "refundable"].map((s) => '<button type="button" class="tab" role="tab" aria-selected="' + (s === l.state) + '" data-state="' + s + '">' + STATE_LABEL[s] + '</button>').join("") + '</div>';
    const balloon = l.state === "live"
      ? '<div class="popped" role="img" aria-label="' + esc(l.name) + ' has launched">' + Array.from({ length: 18 }, (_, i) => { const a = i / 18 * Math.PI * 2, r = 300 * (0.3 + (i % 3) * 0.08), w = 7 + (i % 3) * 3; return '<span class="confetti" style="width:' + w + 'px;height:' + w * 1.6 + 'px;background:' + ["#fb473b", "#fddf31", "#37c04a", "#ffbf5e", "#000"][i % 5] + ';--dx:' + (Math.cos(a) * r).toFixed(0) + 'px;--dy:' + (Math.sin(a) * r * 0.8).toFixed(0) + 'px;--rot:' + (i * 47 % 360) + 'deg" aria-hidden="true"></span>'; }).join("") + '<img src="' + l.face + '" alt=""></div>'
      : '<div class="big' + (l.state === "funding" ? " balloon-float" : "") + '"><img src="' + l.featured + '" alt="' + esc(l.name) + ' balloon" style="transform:scale(' + scaleOf(p.bps).toFixed(3) + ')"></div>';
    const acts = l.state === "live" ? '<div class="acts"><button type="button" class="btn btn-red btn-lg demo-act">Claim ' + fmtTok(exTok) + ' ' + esc(l.ticker) + '</button><a class="btn btn-lg" href="https://raydium.io/" target="_blank" rel="noreferrer noopener">Trade ' + esc(l.ticker) + '</a></div><p class="label toast" data-demo-toast hidden></p><p class="label" style="margin-top:12px">Demo preview: this wallet position is an example. In the connected app these buttons send real transactions.</p>'

  function wireBacking(root) {
    root.querySelectorAll(".backing").forEach((b) => {
      const remaining = Number(b.dataset.remaining) / SOL, ticker = b.dataset.ticker;
      const inp = b.querySelector(".amount"), err = b.querySelector(".err"), go = b.querySelector(".go-review"), conf = b.querySelector(".confirm");
      const calc = () => {
        const raw = inp.value.replace(/[^0-9.]/g, ""); if (raw !== inp.value) inp.value = raw;
        const v = raw === "" ? null : Number(raw);
        const bad = v === null || !isFinite(v);
        const tooSmall = !bad && v < V1.minContribution && Math.abs(v - remaining) > 1e-9, tooBig = !bad && v > remaining + 1e-9;
        const valid = !bad && v > 0 && !tooSmall && !tooBig;
        err.textContent = bad && raw !== "" ? "Enter a number with up to 9 decimals." : tooSmall ? "Minimum is 0.01 SOL, unless you fill the exact remainder." : tooBig ? "Only " + fmtSol(remaining * SOL) + " SOL is left. A larger amount is rejected whole, never partly taken." : "";
        b.querySelector(".est-tokens").textContent = valid ? fmtTok(entitlement(v)) + " " + ticker : "—";
        b.querySelector(".est-share").textContent = valid ? (v / 50 * 100).toFixed(2) + "%" : "—";
        go.disabled = !valid; go.textContent = valid ? "Back with " + fmtSol(v * SOL) + " SOL" : "Back with SOL";
        b.querySelectorAll(".preset").forEach((p) => p.setAttribute("aria-pressed", String(p.dataset.v === raw)));
        return valid ? v : null;
      };
      inp.addEventListener("input", calc);
      b.querySelectorAll(".preset, .fill").forEach((p) => p.addEventListener("click", () => { inp.value = p.dataset.v; calc(); }));
      go.addEventListener("click", () => { const v = calc(); if (v === null) return; b.querySelector(".r-amount").textContent = fmtSol(v * SOL) + " SOL"; b.querySelector(".r-tokens").textContent = fmtTok(entitlement(v)) + " " + ticker; b.querySelector(".r-refund").textContent = "Reclaim " + fmtSol(v * SOL) + " SOL"; conf.textContent = "Back with " + fmtSol(v * SOL) + " SOL"; b.querySelector(".step1").hidden = true; b.querySelector(".step2").hidden = false; });
      b.querySelector(".go-back").addEventListener("click", () => { b.querySelector(".step2").hidden = true; b.querySelector(".step1").hidden = false; b.querySelector(".demo-note").hidden = true; });
      conf.addEventListener("click", () => { b.querySelector(".demo-note").hidden = false; });
      calc();
    });
  }

    const addrs = [["Pop Launch program", "Gj6B3nfzze1aZyYkmrk21LymU4oo1BFDEpa1s6NG2MXy"], ["Raydium CP-Swap", "CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C"], ["Raydium pool-creation fee receiver", "DNXgeM9EiiaAbaWvwjHj9fQQLAX5ZsfHyvmYUNRAdNC8"], ["Token Metadata program", "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"], ["Wrapped SOL", "So11111111111111111111111111111111111111112"]];
    return '<div class="wrap page" style="max-width:932px"><h1 class="display" style="font-size:40px">Who controls what</h1><p style="font-weight:700;font-size:18px;margin-top:12px;max-width:60ch">Pop Launch is not trustless while a key can upgrade the program. This page says exactly who holds which power, and what each key cannot do.</p>' +
      '<div style="margin-top:32px;display:flex;flex-direction:column;gap:16px">' + rows.map((r) => '<section class="box panel"><h2 class="display">' + r[0] + '</h2><dl class="kv" style="margin-top:12px;gap:8px"><div style="justify-content:flex-start;gap:12px"><dt class="muted" style="flex:0 0 72px">Held by</dt><dd style="text-align:left">' + r[1] + '</dd></div><div style="justify-content:flex-start;gap:12px"><dt class="muted" style="flex:0 0 72px">Can</dt><dd style="text-align:left">' + r[2] + '</dd></div><div style="justify-content:flex-start;gap:12px"><dt class="muted" style="flex:0 0 72px">Cannot</dt><dd style="text-align:left">' + r[3] + '</dd></div></dl></section>').join("") + '</div>' +
      '<h2 class="display" style="font-size:28px;margin-top:48px">Addresses on mainnet</h2><p class="label" style="margin-top:8px">Every address a launch depends on is fixed at opening and verified live before any cluster goes public.</p><dl style="margin-top:16px;display:flex;flex-direction:column;gap:10px;font-size:15px">' + addrs.map((a) => '<div><dt class="muted">' + a[0] + '</dt><dd class="addr" style="margin-top:2px">' + a[1] + '</dd></div>').join("") + '</dl>' +
      '<h2 class="display" style="font-size:28px;margin-top:48px">What every coin gets, automatically</h2><ul style="margin:12px 0 0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:8px"><li>The whole supply is minted into program vaults when the launch opens, then the mint authority is revoked. No freeze authority is ever set.</li><li>Token metadata is written once, immutable, with the launch itself as its update authority.</li><li>Backed SOL sits in a launch-specific escrow that only the program can move, and only into the pool or back to the backer.</li><li>At settlement every LP token the pool issues is burned in the same transaction. Nobody can withdraw the pooled SOL and tokens.</li></ul>' +
      '<p class="label" style="margin-top:32px">See also <a class="link" href="#how">How it works</a> and the <a class="link" href="#terms">Terms</a>.</p></div>';

  // ---------- router ----------
  const main = document.getElementById("main");
  const LINKS = [["#home", "Explore"], ["#create", "Launch"], ["#mypops", "My pops"], ["#how", "How it works"]];
  let launchState = {};
  function route() {
    const h = (location.hash || "#home").slice(1);
    let view, current = "#home";
    if (h === "home" || h === "launches" || h === "") view = homeView();
    else if (h.startsWith("launch-")) { const id = h.slice(7); view = launchView(id, launchState[id] || "funding"); }
    else if (h === "create") { view = createView(); current = "#create"; }
    else if (h === "how") { view = howView(); current = "#how"; }
    else if (h === "mypops") { view = myPopsView(); current = "#mypops"; }
    else if (h === "terms") view = termsView();
    else if (h === "authority") view = authorityView();
    else if (h === "privacy") view = privacyView();
    else view = homeView();
    main.innerHTML = view;
    document.querySelectorAll("#nav-desktop a, #mobile-menu a").forEach((a) => a.setAttribute("aria-current", a.getAttribute("href") === current ? "page" : ""));
    wire(h);
    fitFeatured();
    if (h === "launches") { const el = document.getElementById("launches"); if (el) el.scrollIntoView(); } else window.scrollTo({ top: 0 });
  }
  function wire(h) {
    wireBacking(main);
    if (h === "create") wireCreate(main);
    main.querySelectorAll("[data-state]").forEach((b) => b.addEventListener("click", () => { launchState[h.slice(7)] = b.dataset.state; route(); }));
    const os = main.querySelector("#open-sheet"), sheet = main.querySelector("#sheet");
    if (os && sheet) { os.addEventListener("click", () => { sheet.hidden = false; }); sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.hidden = true; }); sheet.querySelectorAll(".close-sheet").forEach((c) => c.addEventListener("click", () => { sheet.hidden = true; })); }
    const cp = main.querySelector("#copy-link");
    if (cp) cp.addEventListener("click", () => { const url = location.href.split("?")[0]; const done = () => { cp.textContent = "Link copied"; setTimeout(() => { cp.textContent = "Copy link"; }, 1500); }; try { navigator.clipboard.writeText(url).then(done, done); } catch (e) { done(); } });
    main.querySelectorAll(".demo-act").forEach((b) => b.addEventListener("click", () => { const t = main.querySelector("[data-demo-toast]"); if (t) { t.hidden = false; t.textContent = "Demo preview: no wallet is connected, so nothing happens. The connected app sends a real transaction here."; } }));
    main.querySelectorAll("[data-ptab]").forEach((t) => t.addEventListener("click", () => { main.querySelectorAll("[data-ptab]").forEach((x) => x.setAttribute("aria-selected", String(x === t))); main.querySelectorAll("[data-pt]").forEach((li) => { li.hidden = li.dataset.pt !== t.dataset.ptab; }); }));
  }
  function fitFeatured() { const w = main.querySelector(".feat-wrap"); if (!w) return; const avail = w.parentElement.clientWidth - (window.innerWidth >= 1024 ? 48 : 0); const hero = w.parentElement; const copy = hero.querySelector(".copy"); let s = 1; if (window.innerWidth >= 1024) { const room = hero.clientWidth - 48 - Math.min(copy.scrollWidth, 480); s = Math.max(0.6, Math.min(1, room / 887)); } w.style.setProperty("--s", s.toFixed(3)); void avail; }
  // header nav
  document.getElementById("nav-desktop").innerHTML = LINKS.map((l) => '<a class="nav-link" href="' + l[0] + '">' + l[1] + '</a>').join("");
  document.getElementById("mobile-menu").innerHTML = LINKS.map((l) => '<a role="menuitem" href="' + l[0] + '">' + l[1] + '</a>').join("");
  const wbtn = document.getElementById("wallet-btn"), wmenu = document.getElementById("wallet-menu"), burger = document.getElementById("burger"), mmenu = document.getElementById("mobile-menu");
  const closeMenus = () => { wmenu.hidden = true; mmenu.hidden = true; wbtn.setAttribute("aria-expanded", "false"); burger.setAttribute("aria-expanded", "false"); };
  wbtn.addEventListener("click", (e) => { e.stopPropagation(); const open = wmenu.hidden; closeMenus(); wmenu.hidden = !open; wbtn.setAttribute("aria-expanded", String(open)); });
  burger.addEventListener("click", (e) => { e.stopPropagation(); const open = mmenu.hidden; closeMenus(); mmenu.hidden = !open; burger.setAttribute("aria-expanded", String(open)); });
  document.addEventListener("click", (e) => { if (!document.getElementById("hdr-right").contains(e.target)) closeMenus(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenus(); const s = main.querySelector("#sheet"); if (s) s.hidden = true; } });
  mmenu.addEventListener("click", (e) => { if (e.target.tagName === "A") closeMenus(); });
  window.addEventListener("hashchange", route);
  window.addEventListener("resize", fitFeatured);
  setInterval(() => { document.querySelectorAll("[data-left]").forEach((el) => { el.textContent = left(Number(el.dataset.left)); }); }, 30000);
  route();
})();
